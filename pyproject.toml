[project]
name = "atc"
version = "0.1.0"
description = "Start coding agents in the right account, with settings built from shared configuration"
requires-python = ">=3.13"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "click>=8.5.0",
    "pydantic>=2.9",
    "questionary>=2.1.1",
    "rich>=15.0.0",
    "rich-click>=1.9.9",
    "ruamel-yaml>=0.19.1",
]

[project.scripts]
atc = "atc.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atc"]

[dependency-groups]
dev = ["basedpyright>=1.31", "pytest>=8.3", "ruff>=0.14"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = [
  # pycodestyle
  "E", # errors
  "W", # warnings
  # pyflakes
  "F",
  # pyupgrade
  "UP",
  # flake8-bugbear
  "B",
  # flake8-simplify
  "SIM",
  # isort
  "I",
  # pep8 naming
  "N",
  # pydocstyle
  "D",
  "D211",
  "D213",
  # ruff-specific
  "RUF",
  # tryceratops
  "TRY",
  # flake8-executable
  "EXE",
  # flake8-datetimez
  "DTZ",
  # flake8-copyright notice
  # "CPY",
  # flake8-comprehensions
  "C4",
  # flake8-commas
  "COM",
  # flake8-blind-except
  "BLE",
  # flake8-bandit
  "S",
]
ignore = [
  "D10",    # missing docstring in public modules, etc
  "D203",   # mutually exclusive with D211
  "D212",   # mutually exclusive with D213
  "COM812", # ignore missing trailing comma
  "CPY001", # missing copyright notice
  "S101",   # use of assert
  "BLE001", # ignore bling exceptions
  "TRY003", # avoid long messages outside exception class
  "TRY400", # ignore using 'exception' logging instead of 'error'
]
